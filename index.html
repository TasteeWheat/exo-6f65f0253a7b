<style>
:root{--bg:#0d1014;--panel:#151a21;--line:#262e39;--text:#dfe6ee;--dim:#8794a3;--acc:#4da3ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;position:fixed;inset:0;overscroll-behavior:none;-webkit-text-size-adjust:100%}

#app{display:flex;height:100vh}#view{flex:1;position:relative}

.sub{color:var(--dim);font-size:11px}
.row{margin:7px 0}.row label{display:flex;justify-content:space-between;color:var(--dim)}.row label b{color:var(--text);font-weight:500}
input[type=range]{width:100%;accent-color:var(--acc)}
.tg{display:flex;flex-wrap:wrap;gap:6px}.tg button,.seg button{background:#1c232c;border:1px solid var(--line);color:var(--text);padding:5px 9px;border-radius:6px;cursor:pointer;font-size:12px}

@media (max-width:760px){

 #panel{position:fixed;left:0;right:0;bottom:0;width:auto;max-height:58vh;border-left:0;border-top:1px solid var(--line);border-radius:16px 16px 0 0;padding:0 16px calc(14px + env(safe-area-inset-bottom));transition:transform .25s ease;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;z-index:5}
 #panel.collapsed{transform:translateY(calc(100% - 56px - env(safe-area-inset-bottom)))}
 #sheetHead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;background:var(--panel);height:56px;z-index:2;cursor:pointer}

 #hud div.x{display:none}
 #hint{display:none}
 .row{margin:12px 0}input[type=range]{height:32px}

}

<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>

<div id="app"><div id="view"><div id="hud"></div><div id="hint">Drag: orbit · Right-drag: pan · Wheel: zoom · Estimates only</div><div id="err">3D failed to load (needs internet for three.js CDN)</div></div>
<div id="panel" class="collapsed"><div id="sheetHead"><b>Exo controls</b><span class="sub" id="sheetTog">Tap to open ▲</span></div><h1>Legs: 3D Exo Design Visualizer</h1><div class="sub">Self-standing load-carrying hiking exoskeleton · parametric concept</div><div id="controls"></div></div></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer,CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

/* =====================================================================
   CONFIG — every tunable parameter lives here. Edit freely.
   Units: cm / mm / kg / degrees as noted. Masses are rough estimates.
   ===================================================================== */
const CONFIG = {
  params: { // live (UI-controlled) values + ranges
    userHeight:   {v:178, min:150, max:200, step:1,  label:'User height', unit:'cm'},
    packVolume:   {v:55,  min:20,  max:90,  step:5,  label:'Backpack size', unit:'L'},
    packMass:     {v:18,  min:0,   max:40,  step:1,  label:'Backpack weight', unit:'kg'},
    mastHeight:   {v:60,  min:20,  max:120, step:1,  label:'Mast height (above pack)', unit:'cm'},
    canopyExtend: {v:70,  min:0,   max:100, step:1,  label:'Shade open (collapse ↔ open)', unit:'%'},
    hipAngle:     {v:0,   min:-30, max:100, step:1,  label:'Hip flexion', unit:'°'},
    kneeAngle:    {v:0,   min:0,   max:130, step:1,  label:'Knee flexion', unit:'°'},
    thighCirc:    {v:55,  min:40,  max:75,  step:1,  label:'Thigh circumference', unit:'cm'},
    calfCirc:     {v:38,  min:28,  max:50,  step:1,  label:'Calf circumference', unit:'cm'},
    cuffOffsetThigh:{v:0, min:-8,  max:8,   step:1,  label:'Thigh cuff position offset', unit:'cm'},
    cuffOffsetShin: {v:0, min:-8,  max:8,   step:1,  label:'Shin cuff position offset', unit:'cm'},
    strapTight:   {v:70,  min:0,   max:100, step:5,  label:'Strap tightness (visual)', unit:'%'},
    gaitSpeed:    {v:1.0, min:0.3, max:2,   step:0.1,label:'Gait cycle speed', unit:'Hz'},
  },
  toggles: { canopy:true, starlinkAttached:true, packOn:true, kickstand:true, cuffsOpen:false, harness:true, human:true, labels:true, battery:true },
  toggleLabels: { canopy:'Shade deployed', starlinkAttached:'Starlink attached', packOn:'Pack on cradle', kickstand:'Kickstand (park)', cuffsOpen:'Cuffs open (step-in)', harness:'Shoulder harness', human:'Human', labels:'Labels', battery:'Battery' },
  anim: {seconds:1.2},
  cuffs: {openDeg:75, shellArcDeg:210, beltHeight:0.12, labelSide:true}, // human-interface cuffs        // deploy/stow, fold, detach animation time
  pose: 'standing',          // 'standing' | 'walking' | 'kneel' | 'park'
  material: 'aluminum',      // 'aluminum' | 'carbon'
  geometry: {
    hipWidth: 0.36,          // m, leg spacing (hip actuator centers)
    thighRatio: 0.245, shankRatio: 0.246, ankleHeight: 0.07, // × user height
    tubeDia: 0.032, adjustDia: 0.026, adjustLen: 0.09,     // telescoping sections
    actuator: {dia:0.098, len:0.061, massKg:0.485},        // T-Motor AK80-64 ~98mm × 61mm, ~485 g
    foot: {l:0.28, w:0.11, t:0.018},
    spineDia: 0.03, packDepth: 0.22,
    starlink: {l:0.299, w:0.259, t:0.038, massKg:1.16},     // Starlink Mini
    battery: {w:0.20, h:0.14, d:0.06, massKg:2.2},
    canopyMaxSpan: 1.1,      // m, shade rib span fully open
    module: {hubBelow:0.06, plateDia:0.12, openDeg:78, foldedDeg:4},       // integrated top module
    cradle: {width:0.34, depth:0.26, railH:0.32},                          // pack shelf + rails
    park: {footSpread:0.05, footWidth:0.17, toeExt:0.09, heelExt:0.07,     // self-stand geometry (m)
           kickPivotFrac:0.2, kickReach:0.55, kickStowLen:0.38, kickSplay:0.35, kickLegs:[-1,1]},
  },
  mass: { // kg, structural estimates per material
    aluminum: {tubePerM:0.55, hipBelt:1.4, foot:0.45, ankle:0.25, spineFrame:1.3},
    carbon:   {tubePerM:0.28, hipBelt:1.0, foot:0.32, ankle:0.20, spineFrame:0.8},
    mast:0.5, canopy:0.6, qrPlate:0.12, cradle:0.6, kickLeg:0.35, footExt:0.25, cuff:0.18, harness:0.45, electronics:0.6, packEmptyPerL:0.03,
  },
  gait: {hipAmp:22, hipOffset:5, kneePeak:60},
  colors: {
    aluminum:{frame:0xb9c2cc, metal:0.85, rough:0.32}, carbon:{frame:0x24272c, metal:0.3, rough:0.45},
    actuator:0x3a8dde, adjust:0xf0a030, foot:0x2d333b, binding:0xd94f4f, pack:0x3f6b4a,
    battery:0xe0c040, starlink:0xeeeeee, canopy:0x3fb3a5, human:0x9fd0ff, com:0xff3b6b, ground:0x161b22, footExt:0x56606c, kick:0xf0a030, qr:0x8a96a3, strap:0x1d1f22, stable:0x3ddc84, pad:0xc9b8a6, boa:0xe05a2a, unstable:0xff4d4d,
  },
};
/* ===================================================================== */

const P = k => CONFIG.params[k].v, D2R = Math.PI/180;
const view = document.getElementById('view');
let renderer;
try { renderer = new THREE.WebGLRenderer({antialias:true}); } catch(e){ document.getElementById('err').style.display='block'; throw e; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2)); renderer.shadowMap.enabled = true;
view.appendChild(renderer.domElement);
const lr = new CSS2DRenderer(); lr.domElement.style.cssText='position:absolute;top:0;left:0;pointer-events:none'; view.appendChild(lr.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x0d1014); scene.fog = new THREE.Fog(0x0d1014, 6, 14);
const cam = new THREE.PerspectiveCamera(40,1,0.05,50); cam.position.set(3.2,1.9,3.4); if(innerWidth<760) cam.position.set(3.8,2.1,4.1);
const ctl = new OrbitControls(cam, renderer.domElement); ctl.target.set(0,1.15,0); ctl.enableDamping = true; ctl.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN}; ctl.screenSpacePanning=true;
renderer.domElement.addEventListener("touchmove",e=>e.preventDefault(),{passive:false});
document.addEventListener("gesturestart",e=>e.preventDefault());
const sheet=document.getElementById("panel"); document.getElementById("sheetHead").onclick=()=>{sheet.classList.toggle("collapsed"); document.getElementById("sheetTog").textContent=sheet.classList.contains("collapsed")?"Tap to open ▲":"Tap to close ▼";};
scene.add(new THREE.HemisphereLight(0xcfe3ff,0x20242a,0.9));
const sun = new THREE.DirectionalLight(0xffffff,1.6); sun.position.set(3,5,2); sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-2,right:2,top:3,bottom:-1}); scene.add(sun);
const ground = new THREE.Mesh(new THREE.CircleGeometry(6,64), new THREE.MeshStandardMaterial({color:CONFIG.colors.ground,roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
const grid = new THREE.GridHelper(8,32,0x2a3340,0x1d242d); grid.position.y=0.001; scene.add(grid);

let root = new THREE.Group(); scene.add(root);
const mats = {};
function mat(key,color,o={}){ return new THREE.MeshStandardMaterial({color,metalness:o.m??0.2,roughness:o.r??0.6,transparent:!!o.op,opacity:o.op??1,depthWrite:o.op?false:true,side:o.side??THREE.FrontSide}); }
function mesh(geo,m,parent){ const x=new THREE.Mesh(geo,m); x.castShadow=x.receiveShadow=!m.transparent; parent.add(x); return x; }
function tubeBetween(a,b,r,m,parent){ const d=new THREE.Vector3().subVectors(b,a), L=d.length(); if(!(L>1e-5)){console.warn('zero tube',a,b);return null;}
  const t=mesh(new THREE.CylinderGeometry(r,r,L,20),m,parent); t.position.copy(a).addScaledVector(d,.5);
  t.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),d.clone().normalize()); return t; }
function box(w,h,d,m,parent,pos){ const b=mesh(new THREE.BoxGeometry(w,h,d),m,parent); if(pos) b.position.copy(pos); return b; }
function label(text,pos,parent){ if(!CONFIG.toggles.labels) return; const el=document.createElement('div'); el.className='lbl'; el.textContent=text; const o=new CSS2DObject(el); o.position.copy(pos); parent.add(o); }
function actuator(pos,m,parent,name){ const g=CONFIG.geometry.actuator; const c=mesh(new THREE.CylinderGeometry(g.dia/2,g.dia/2,g.len,32),m,parent); c.rotation.z=Math.PI/2; c.position.copy(pos);
  const cap=mesh(new THREE.CylinderGeometry(g.dia/2*0.55,g.dia/2*0.55,g.len+0.008,24),mat('',0x1b2633,{m:.6,r:.4}),parent); cap.rotation.z=Math.PI/2; cap.position.copy(pos); if(name) label(name,pos.clone().add(new THREE.Vector3(Math.sign(pos.x)*0.09,0,0)),parent); }

// Telescoping link: main tube + visible adjust section (orange) + lock collars
function teleLink(a,b,m,parent,name){ const G=CONFIG.geometry, d=new THREE.Vector3().subVectors(b,a), L=d.length(), u=d.clone().normalize();
  const mid=a.clone().addScaledVector(u,L*0.5);
  tubeBetween(a,a.clone().addScaledVector(u,L*0.5-G.adjustLen/2),G.tubeDia/2,m,parent);
  tubeBetween(mid.clone().addScaledVector(u,-G.adjustLen/2),mid.clone().addScaledVector(u,G.adjustLen/2),G.adjustDia/2,mat('',CONFIG.colors.adjust,{m:.5,r:.35}),parent);
  tubeBetween(mid.clone().addScaledVector(u,G.adjustLen/2),b,G.tubeDia/2*0.92,m,parent);
  for(const s of [-1,1]) tubeBetween(mid.clone().addScaledVector(u,s*G.adjustLen/2-0.01),mid.clone().addScaledVector(u,s*G.adjustLen/2+0.01),G.tubeDia/2+0.006,mat('',0x111418,{m:.4,r:.5}),parent);
  if(name) label(name,mid.clone().add(new THREE.Vector3(Math.sign(a.x)*0.08,0,0)),parent);
  return L; }

const hud=document.getElementById('hud'); let t0=performance.now();
function gaitAngles(t,side){ const g=CONFIG.gait, ph=2*Math.PI*P('gaitSpeed')*t + (side<0?Math.PI:0);
  const hip=g.hipOffset+g.hipAmp*Math.sin(ph); const knee=Math.max(0,Math.sin(ph+1.2))**2*g.kneePeak+5; return {hip,knee}; }

// ---------- animation state (eased toward targets each frame) ----------
const anim={kick:0, slLift:0, shade:1, cuff:0};
function targets(){ return {kick:CONFIG.pose==='park'&&CONFIG.toggles.kickstand?1:0, slLift:CONFIG.toggles.starlinkAttached?0:1, shade:CONFIG.toggles.canopy?1:0, cuff:CONFIG.toggles.cuffsOpen?1:0}; }
function stepAnim(dt){ const T=targets(); let moving=false; for(const k in anim){ const d=T[k]-anim[k]; if(Math.abs(d)>0.002){ anim[k]+=Math.sign(d)*Math.min(Math.abs(d),dt/CONFIG.anim.seconds); moving=true; } else anim[k]=T[k]; } return moving; }
function hull(pts){ pts=pts.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]); const cr=(o,a,b)=>(a[0]-o[0])*(b[1]-o[1])-(a[1]-o[1])*(b[0]-o[0]); const lo=[],up=[];
  for(const p of pts){ while(lo.length>=2&&cr(lo[lo.length-2],lo[lo.length-1],p)<=0) lo.pop(); lo.push(p); }
  for(const p of pts.reverse()){ while(up.length>=2&&cr(up[up.length-2],up[up.length-1],p)<=0) up.pop(); up.push(p); }
  up.pop(); lo.pop(); return lo.concat(up); }
function inPoly(p,poly){ let c=false; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const [xi,zi]=poly[i],[xj,zj]=poly[j]; if(((zi>p[1])!==(zj>p[1]))&&(p[0]<(xj-xi)*(p[1]-zi)/(zj-zi)+xi)) c=!c; } return c; }
function polyMargin(p,poly){ let m=Infinity; for(let i=0,j=poly.length-1;i<poly.length;j=i++){ const [ax,az]=poly[j],[bx,bz]=poly[i], dx=bx-ax,dz=bz-az, L2=dx*dx+dz*dz; let u=((p[0]-ax)*dx+(p[1]-az)*dz)/L2; u=Math.max(0,Math.min(1,u)); m=Math.min(m,Math.hypot(p[0]-ax-u*dx,p[1]-az-u*dz)); } return m; }

function build(t){
  scene.remove(root); root.traverse(o=>{ if(o.geometry) o.geometry.dispose(); if(o.element) o.element.remove(); }); root=new THREE.Group(); scene.add(root);
  const G=CONFIG.geometry, C=CONFIG.colors, mm=CONFIG.mass[CONFIG.material], cm=C[CONFIG.material], park=CONFIG.pose==='park';
  const H=P('userHeight')/100, thigh=H*G.thighRatio, shank=H*G.shankRatio, ank=G.ankleHeight;
  const frameM=mat('',cm.frame,{m:cm.metal,r:cm.rough}), actM=mat('',C.actuator,{m:.6,r:.35}), darkM=mat('',0x14181d,{r:.8});
  const legs=[-1,1].map(s=>{ let a;
    if(CONFIG.pose==='walking') a=gaitAngles(t,s);
    else if(CONFIG.pose==='kneel') a= s<0?{hip:90,knee:90}:{hip:0,knee:90};
    else if(park) a={hip:0,knee:0};
    else a={hip:P('hipAngle'),knee:P('kneeAngle')};
    const th=a.hip*D2R, sh=(a.hip-a.knee)*D2R;
    const knee=new THREE.Vector3(0,-thigh*Math.cos(th),thigh*Math.sin(th));
    const ankle=knee.clone().add(new THREE.Vector3(0,-shank*Math.cos(sh),shank*Math.sin(sh)));
    return {s,a,knee,ankle}; });
  const kneeR=G.actuator.dia/2;
  const hipY=Math.max(...legs.map(l=>Math.max(-l.ankle.y+ank,-l.knee.y+kneeR)));
  const masses=[]; const addM=(kg,p,n)=>masses.push({kg,p:p.clone(),n});
  const contacts=[]; // [x,z] ground contact points
  const spread=park?G.park.footSpread:0;
  const FL=G.foot.l+(park?G.park.toeExt+G.park.heelExt:0), FW=park?G.park.footWidth:G.foot.w, Fz=park?(G.park.toeExt-G.park.heelExt)/2:0;
  legs.forEach(l=>{ const x=l.s*G.hipWidth/2, hip=new THREE.Vector3(x,hipY,0), kn=l.knee.clone().add(hip).setX(x), an=l.ankle.clone().add(hip).setX(x+l.s*spread);
    actuator(hip,actM,root,l.s>0?'Hip actuator (AK80-64)':null); actuator(kn,actM,root,l.s>0?'Knee actuator (AK80-64)':null);
    teleLink(hip,kn,frameM,root,l.s>0?'Thigh link (telescoping)':null);
    teleLink(kn,an,frameM,root,l.s>0?'Shank link (telescoping)':null);
    // ---- human-interface cuffs (padded half-shells, front-open, BOA straps) ----
    { const hx=l.s*0.1, hHip=new THREE.Vector3(hx,hipY,0.02), hKn=l.knee.clone().add(hHip).setX(hx), hAn=l.ankle.clone().add(hHip).setX(hx);
      const rT=P('thighCirc')/100/(2*Math.PI), rC=P('calfCirc')/100/(2*Math.PI), oT=P('cuffOffsetThigh')/100, oS=P('cuffOffsetShin')/100;
      const cuffs=[['Upper-thigh cuff',hHip,hKn,0.28+oT/thigh,rT*1.02,0.09,hip,kn],['Lower-thigh cuff (above knee)',hHip,hKn,0.8+oT/thigh,rT*0.82,0.07,hip,kn],
                   ['Upper-shin cuff (below knee)',hKn,hAn,0.2+oS/shank,rC*0.92,0.07,kn,an],['Ankle / boot cuff',hKn,hAn,0.86,rC*0.62,0.06,kn,an]];
      cuffs.forEach(([name,a0,b0,f,r,hgt,ea,eb])=>{ f=Math.max(0.08,Math.min(0.94,f)); const c=a0.clone().lerp(b0,f), dir=b0.clone().sub(a0).normalize();
        const g=new THREE.Group(); g.position.copy(c); g.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir); root.add(g);
        const hinge=new THREE.Group(); hinge.position.set(l.s*r,0,0); hinge.rotation.y=l.s*anim.cuff*CONFIG.cuffs.openDeg*D2R; g.add(hinge);
        const inner=new THREE.Group(); inner.position.set(-l.s*r,0,0); hinge.add(inner);
        const arc=CONFIG.cuffs.shellArcDeg*D2R, th0=Math.PI-arc/2;
        mesh(new THREE.CylinderGeometry(r+0.008,r+0.008,hgt,28,1,true,th0,arc),mat('',cm.frame,{m:cm.metal*0.6,r:.5,side:THREE.DoubleSide}),inner);
        mesh(new THREE.CylinderGeometry(r,r,hgt*0.92,28,1,true,th0-0.1,arc+0.2),mat('',C.pad,{r:.95,side:THREE.DoubleSide}),inner);
        const tight=P('strapTight')/100, rs=(r+0.008)*(1.06-0.06*tight);
        if(anim.cuff<0.5){ for(const dy of [-hgt*0.25,hgt*0.25]){ const st=mesh(new THREE.TorusGeometry(rs,0.004+0.002*(1-tight),6,32,2*Math.PI-arc+0.5),mat('',C.strap,{r:.8}),inner); st.rotation.x=Math.PI/2; st.rotation.z=-(Math.PI/2)+(arc/2)-0.25+Math.PI; st.position.y=dy; } }
        const dial=mesh(new THREE.CylinderGeometry(0.014,0.014,0.012,16),mat('',C.boa,{m:.4,r:.4}),inner); dial.rotation.x=Math.PI/2; dial.position.set(l.s*r*0.75,0,-(r*0.7)); 
        const ep=ea.clone().lerp(eb,f); tubeBetween(ep,c.clone().add(new THREE.Vector3(l.s*r,0,0)),0.008,frameM,root);
        if(l.s>0&&CONFIG.cuffs.labelSide) label(name+(anim.cuff>0.5?' — open':''),c.clone().add(new THREE.Vector3(-0.2,0,0.08)),root);
        addM(CONFIG.mass.cuff,c,'cuff'); }); }

{ const n=document.createElement('p'); n.className='sub'; n.style.marginTop='16px'; n.textContent='Weights, CoM and stability are rough estimates from CONFIG.mass. Support polygon = convex hull of ground contacts (foot plates, kickstand pads, knee). Green = CoM projection inside.'; cEl.appendChild(n); }
